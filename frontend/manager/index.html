<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager Stock Dashboard | Smart Campus Canteen</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: var(--bg-main);">
  <div id="navbar-container"></div>

  <div class="container" style="max-width: 1040px; margin: 2rem auto;">
    <div style="margin-bottom: 1.75rem;">
      <span class="role-badge" style="background: rgba(37,99,235,0.1); color: var(--primary); margin-bottom: 0.5rem;">
        🏢 BRANCH MANAGER INVENTORY PORTAL
      </span>
      <h1 style="color: var(--primary-dark); font-weight: 800; font-size: 1.8rem; margin: 0.25rem 0;">Branch Stock Control & Transfers</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Manage inter-branch food stock transfers and inventory rebalancing across campus outlets.</p>
    </div>

    <!-- Request Stock Transfer Form -->
    <div class="card" style="padding: 1.75rem; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); margin-bottom: 1.75rem;">
      <h3 style="margin-bottom: 1.25rem; color: var(--primary-dark); font-weight: 800; font-size: 1.2rem;">📦 Initiate Inter-Branch Stock Transfer</h3>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
        <div class="form-group">
          <label class="form-label">Food Item</label>
          <select id="trf-item-select" class="form-control" style="font-weight: 600;">
            <option value="605c7328f111a111a111a201">Crispy Veg Samosa</option>
            <option value="605c7328f111a111a111a202">Grilled Cheese Veg Sandwich</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Transfer Quantity</label>
          <input type="number" id="trf-qty-input" class="form-control" value="20" min="1" style="font-weight: 700;">
        </div>

        <div class="form-group">
          <label class="form-label">Source Branch</label>
          <select id="trf-source-select" class="form-control" style="font-weight: 600;">
            <option value="605c7328f111a111a111a111">Main Canteen</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Destination Branch</label>
          <select id="trf-dest-select" class="form-control" style="font-weight: 600;">
            <option value="605c7328f111a111a111a112">Hostel Canteen</option>
          </select>
        </div>
      </div>

      <button onclick="requestStockTransfer()" class="btn btn-primary" style="margin-top: 0.5rem; padding: 0.75rem 1.5rem; font-weight: 700;">
        Submit Transfer Request 🚀
      </button>
    </div>

    <!-- Stock Transfer History Table -->
    <div class="card" style="padding: 1.75rem; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
      <h3 style="margin-bottom: 1.25rem; color: var(--primary-dark); font-weight: 800; font-size: 1.2rem;">📋 Stock Transfer History & Audit Trail</h3>
      <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem;">
          <thead>
            <tr style="text-align: left; border-bottom: 2px solid var(--border-color); color: var(--text-muted); font-weight: 700;">
              <th style="padding: 0.75rem 0.5rem;">Transfer #</th>
              <th style="padding: 0.75rem 0.5rem;">Item</th>
              <th style="padding: 0.75rem 0.5rem;">Qty</th>
              <th style="padding: 0.75rem 0.5rem;">Source</th>
              <th style="padding: 0.75rem 0.5rem;">Destination</th>
              <th style="padding: 0.75rem 0.5rem;">Status</th>
              <th style="padding: 0.75rem 0.5rem;">Action</th>
            </tr>
          </thead>
          <tbody id="transfers-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/manager.js"></script>
</body>
</html>
