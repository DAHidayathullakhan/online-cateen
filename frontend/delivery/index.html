<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Dashboard | Smart Campus Canteen</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: var(--bg-main);">
  <div id="navbar-container"></div>

  <div class="container" style="max-width: 760px; margin: 2rem auto;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.75rem; flex-wrap: wrap; gap: 1rem;">
      <div>
        <span class="role-badge" style="background: rgba(245,158,11,0.1); color: var(--accent); margin-bottom: 0.5rem;">
          🛵 HOSTEL ROOM DELIVERY FLEET
        </span>
        <h1 style="color: var(--primary-dark); font-weight: 800; font-size: 1.8rem; margin: 0.25rem 0;">Hostel Delivery Tasks</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Manage assigned room food delivery dispatch & status updates.</p>
      </div>
      <button onclick="loadDeliveries()" class="btn btn-outline" style="font-weight: 700; background: white;">
        🔄 Refresh Deliveries
      </button>
    </div>

    <div id="delivery-list"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/delivery.js"></script>
</body>
</html>
