<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offers & Coupons | Smart Campus Canteen</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: var(--bg-main);">
  <div id="navbar-container"></div>

  <div class="container" style="max-width: 860px; margin: 2rem auto;">
    <div style="margin-bottom: 1.75rem;">
      <span class="role-badge" style="background: var(--primary-light); color: var(--primary); margin-bottom: 0.5rem;">
        🏷️ EXCLUSIVE STUDENT PROMO CODES
      </span>
      <h1 style="color: var(--primary-dark); font-weight: 800; font-size: 1.8rem; margin: 0.25rem 0;">Campus Coupons & Deals</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Save on your food orders with student discounts and active promo codes.</p>
    </div>

    <div id="offers-list" class="grid-cards"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('offers-list');
      try {
        const res = await apiRequest('/offers');
        const coupons = res.data;

        if (coupons.length === 0) {
          container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">No active promo coupons available right now.</p>`;
          return;
        }

        container.innerHTML = coupons.map(c => `
          <div class="card" style="border: 2px dashed var(--primary); background: var(--card-bg); padding: 1.5rem; border-radius: var(--radius); box-shadow: var(--shadow-sm);">
            <div style="font-size: 0.75rem; font-weight: 800; color: var(--primary-dark); text-transform: uppercase; letter-spacing: 0.5px;">CAMPUS PROMO CODE</div>
            <h2 style="color: var(--primary); font-weight: 800; font-size: 1.6rem; margin: 0.25rem 0;">${c.code}</h2>
            <p style="font-size: 0.95rem; font-weight: 700; color: var(--text-dark); margin-bottom: 0.5rem;">${c.title}</p>
            <div style="font-size: 0.85rem; color: var(--text-muted);">${c.description}</div>
            <div style="margin-top: 1rem; padding-top: 0.6rem; border-top: 1px solid var(--border-color); font-weight: 700; color: var(--success); font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center;">
              <span>${c.discountType === 'percentage' ? `${c.discountValue}% OFF` : `Flat ₹${c.discountValue} OFF`}</span>
              <span style="font-weight: 500; color: var(--text-muted); font-size: 0.75rem;">Min Order ₹${c.minOrderValue}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {}
    });
  </script>
</body>
</html>
