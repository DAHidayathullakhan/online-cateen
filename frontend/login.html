<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Smart Campus Canteen</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: var(--bg-main); display: flex; flex-direction: column; min-height: 100vh;">
  <nav class="navbar">
    <div class="container nav-content">
      <a href="/menu.html" class="brand-logo">🍔 Smart Campus Canteen</a>
      <ul class="nav-links">
        <li><a href="/menu.html">Menu</a></li>
        <li><a href="/register.html">Register</a></li>
      </ul>
    </div>
  </nav>

  <div class="container" style="max-width: 440px; margin: 3rem auto; flex-grow: 1;">
    <div class="card" style="padding: 2rem;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <span style="font-size: 2.5rem;">🔐</span>
        <h2 style="font-weight: 800; color: var(--primary-dark); margin-top: 0.5rem;">Welcome Back</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in with your College Email or Student ID</p>
      </div>

      <form id="login-form">
        <div style="margin-bottom: 1.25rem;">
          <label class="form-label">College Email or Student ID</label>
          <input type="text" id="login-email" class="form-control" placeholder="student@canteen.edu or STU-2026-001" required>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label class="form-label">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
          Sign In to Canteen
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
        Don't have an account? <a href="/register.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Register here</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.innerText = 'Signing in...';

      try {
        const res = await apiRequest('/auth/login', 'POST', { email, password });
        if (res.success) {
          Auth.setUserSession(res.token, res.data);
          showToast('Login successful!', 'success');
          setTimeout(() => {
            Auth.redirectBasedOnRole(res.data.role);
          }, 500);
        }
      } catch (err) {
        showToast(err.message || 'Login failed', 'error');
        btn.disabled = false;
        btn.innerText = 'Sign In to Canteen';
      }
    });
  </script>
</body>
</html>
