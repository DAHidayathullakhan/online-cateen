<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Menu | Smart Campus Canteen</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: var(--bg-main);">
  <div id="navbar-container"></div>

  <div class="container" style="max-width: 1200px; margin: 2rem auto;">
    <div style="margin-bottom: 1.75rem;">
      <span class="role-badge" style="background: var(--primary-light); color: var(--primary); margin-bottom: 0.5rem;">
        🍔 FULL CAMPUS FOOD CATALOG
      </span>
      <h1 style="color: var(--primary-dark); font-weight: 800; font-size: 1.8rem; margin: 0.25rem 0;">Explore Canteen Menu</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Filter dishes by branch, category, dietary preference, or search by ingredient.</p>
    </div>

    <!-- Filters Header Card -->
    <div class="card" style="padding: 1.25rem; margin-bottom: 1.75rem; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">
        <div>
          <label class="form-label" style="font-weight: 700;">🔍 Search Food Items</label>
          <input type="text" id="search-input" class="form-control" placeholder="Samosa, biryani, coffee, maggi..." style="padding: 0.65rem;">
        </div>

        <div>
          <label class="form-label" style="font-weight: 700;">📍 Canteen Branch</label>
          <select id="branch-select" onchange="loadMenuItems()" class="form-control" style="font-weight: 600; padding: 0.65rem;"></select>
        </div>

        <div>
          <label class="form-label" style="font-weight: 700;">🥬 Dietary Preference</label>
          <select onchange="filterVeg(this.value)" class="form-control" style="font-weight: 600; padding: 0.65rem;">
            <option value="">All Items (Veg & Non-Veg)</option>
            <option value="true">Pure Vegetarian Only (🥬)</option>
            <option value="false">Non-Vegetarian Only (🍗)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Category Filter Chips -->
    <div style="margin-bottom: 1.75rem;">
      <div style="display: flex; gap: 0.65rem; overflow-x: auto; padding: 0.25rem 0.25rem 0.75rem; scrollbar-width: none;">
        <button class="cat-chip active" data-cat="" onclick="filterCategory('')">🍽️ All Categories</button>
        <button class="cat-chip" data-cat="Meals" onclick="filterCategory('Meals')">🍱 Meals</button>
        <button class="cat-chip" data-cat="Breakfast" onclick="filterCategory('Breakfast')">🥐 Breakfast</button>
        <button class="cat-chip" data-cat="Lunch" onclick="filterCategory('Lunch')">🍛 Lunch</button>
        <button class="cat-chip" data-cat="Snacks" onclick="filterCategory('Snacks')">🥪 Snacks</button>
        <button class="cat-chip" data-cat="Beverages" onclick="filterCategory('Beverages')">☕ Beverages</button>
        <button class="cat-chip" data-cat="Fast Food" onclick="filterCategory('Fast Food')">🍜 Fast Food</button>
      </div>
    </div>

    <!-- Menu Grid -->
    <div id="menu-grid" class="grid-cards">
      <!-- Skeleton Loaders -->
      <div class="card" style="padding: 1rem;">
        <div class="skeleton" style="height: 160px; margin-bottom: 1rem;"></div>
        <div class="skeleton" style="height: 20px; width: 70%; margin-bottom: 0.5rem;"></div>
        <div class="skeleton" style="height: 14px; width: 40%; margin-bottom: 1rem;"></div>
        <div class="skeleton" style="height: 38px;"></div>
      </div>
      <div class="card" style="padding: 1rem;">
        <div class="skeleton" style="height: 160px; margin-bottom: 1rem;"></div>
        <div class="skeleton" style="height: 20px; width: 70%; margin-bottom: 0.5rem;"></div>
        <div class="skeleton" style="height: 14px; width: 40%; margin-bottom: 1rem;"></div>
        <div class="skeleton" style="height: 38px;"></div>
      </div>
      <div class="card" style="padding: 1rem;">
        <div class="skeleton" style="height: 160px; margin-bottom: 1rem;"></div>
        <div class="skeleton" style="height: 20px; width: 70%; margin-bottom: 0.5rem;"></div>
        <div class="skeleton" style="height: 14px; width: 40%; margin-bottom: 1rem;"></div>
        <div class="skeleton" style="height: 38px;"></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/menu.js"></script>
</body>
</html>
