<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Dashboard | Smart Campus Canteen</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: var(--bg-main);">
  <div id="navbar-container"></div>

  <div class="container" style="max-width: 960px; margin: 2rem auto;">
    <div style="margin-bottom: 1.75rem;">
      <span class="role-badge" style="background: rgba(37,99,235,0.1); color: var(--primary); margin-bottom: 0.5rem;">
        📱 CANTEEN COUNTER OPERATOR INTERFACE
      </span>
      <h1 style="color: var(--primary-dark); font-weight: 800; font-size: 1.8rem; margin: 0.25rem 0;">Operator Counter Control</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Scan digital food QR tokens for instant hand-over and log daily kitchen food waste metrics.</p>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.75rem;">
      <!-- Token Verification Card -->
      <div class="card" style="padding: 1.75rem; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
        <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem;">
          <div style="width: 42px; height: 42px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem;">📱</div>
          <h3 style="margin: 0; color: var(--primary-dark); font-weight: 800; font-size: 1.2rem;">QR Token Verification</h3>
        </div>

        <div class="form-group">
          <label class="form-label">Scan QR Code or Type Token Number</label>
          <input type="text" id="token-input" class="form-control" placeholder="CAN-2026-A7F92" style="font-size: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; padding: 0.85rem;">
        </div>

        <button onclick="verifyToken()" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem; font-weight: 700;">
          Verify Token & Mark Handed Over ➔
        </button>

        <div id="verification-result" style="margin-top: 1rem;"></div>

        <div style="margin-top: 1.5rem; background: var(--primary-light); padding: 1rem; border-radius: 10px; border: 1px solid rgba(37,99,235,0.2);">
          <div style="font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">READY QUEUE COUNTER ORDERS</div>
          <div id="ready-queue-count" style="font-size: 2rem; font-weight: 800; color: var(--primary-dark); margin-top: 0.25rem;">0</div>
        </div>
      </div>

      <!-- Food Waste Management Form -->
      <div class="card" style="padding: 1.75rem; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
        <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem;">
          <div style="width: 42px; height: 42px; background: #fef3c7; color: #b45309; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem;">♻️</div>
          <h3 style="margin: 0; color: var(--primary-dark); font-weight: 800; font-size: 1.2rem;">Daily Food Waste Audit Log</h3>
        </div>

        <div class="form-group">
          <label class="form-label">Select Canteen Branch</label>
          <select id="waste-branch-select" class="form-control" style="font-weight: 600;">
            <option value="605c7328f111a111a111a111">Main Canteen</option>
            <option value="605c7328f111a111a111a112">Hostel Canteen</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Food Item</label>
          <select id="waste-item-select" class="form-control" style="font-weight: 600;">
            <option value="605c7328f111a111a111a201">Crispy Veg Samosa</option>
            <option value="605c7328f111a111a111a202">South Indian Veg Meals</option>
          </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem;">
          <div>
            <label class="form-label" style="font-size: 0.8rem;">Prepared Qty</label>
            <input type="number" id="waste-prep-qty" class="form-control" value="50" style="font-weight: 700;">
          </div>
          <div>
            <label class="form-label" style="font-size: 0.8rem;">Sold Qty</label>
            <input type="number" id="waste-sold-qty" class="form-control" value="38" style="font-weight: 700;">
          </div>
          <div>
            <label class="form-label" style="font-size: 0.8rem;">Remaining Qty</label>
            <input type="number" id="waste-rem-qty" class="form-control" value="12" style="font-weight: 700;">
          </div>
          <div>
            <label class="form-label" style="font-size: 0.8rem;">Wasted Qty</label>
            <input type="number" id="waste-wasted-qty" class="form-control" value="12" style="font-weight: 700; color: var(--danger);">
          </div>
        </div>

        <button onclick="recordFoodWaste()" class="btn btn-outline btn-block" style="padding: 0.75rem; font-weight: 700; border-color: var(--primary); color: var(--primary);">
          Submit Waste Audit Log 📝
        </button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/operator.js"></script>
</body>
</html>
