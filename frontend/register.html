<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | Smart Campus Canteen</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: var(--bg-main); display: flex; flex-direction: column; min-height: 100vh;">
  <nav class="navbar">
    <div class="container nav-content">
      <a href="/menu.html" class="brand-logo">🍔 Smart Campus Canteen</a>
      <ul class="nav-links">
        <li><a href="/menu.html">Menu</a></li>
        <li><a href="/login.html">Login</a></li>
      </ul>
    </div>
  </nav>

  <div class="container" style="max-width: 520px; margin: 2.5rem auto; flex-grow: 1;">
    <div class="card" style="padding: 2rem;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <span style="font-size: 2.5rem;">🎓</span>
        <h2 style="font-weight: 800; color: var(--primary-dark); margin-top: 0.5rem;">Student Registration</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Create your smart campus canteen account</p>
      </div>

      <form id="register-form">
        <div style="margin-bottom: 1rem;">
          <label class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Rahul Sharma" required>
        </div>

        <div style="margin-bottom: 1rem;">
          <label class="form-label">College Email</label>
          <input type="email" id="reg-email" class="form-control" placeholder="rahul@canteen.edu" required>
        </div>

        <div style="margin-bottom: 1rem;">
          <label class="form-label">Student ID</label>
          <input type="text" id="reg-studentid" class="form-control" placeholder="STU-2026-001" required>
        </div>

        <div style="margin-bottom: 1rem;">
          <label class="form-label">Degree Level</label>
          <select id="reg-degree" class="form-control" required>
            <option value="Degree">Undergraduate (Degree)</option>
            <option value="Master's">Postgraduate (Master's)</option>
          </select>
        </div>

        <div style="margin-bottom: 1rem;">
          <label class="form-label">Academic Program</label>
          <select id="reg-program" class="form-control" required>
            <option value="BCA">BCA - Computer Applications</option>
            <option value="BBA">BBA - Business Administration</option>
            <option value="BCom">BCom - Commerce</option>
            <option value="MCA">MCA - Master of Computer Applications</option>
            <option value="MBA">MBA - Master of Business Administration</option>
          </select>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label class="form-label">Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
        </div>

        <button type="submit" id="reg-btn" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
          Create Student Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
        Already registered? <a href="/login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Sign in here</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const studentId = document.getElementById('reg-studentid').value.trim();
      const degreeLevel = document.getElementById('reg-degree').value;
      const programType = document.getElementById('reg-program').value;
      const password = document.getElementById('reg-password').value;
      const btn = document.getElementById('reg-btn');

      const role = degreeLevel === "Master's" ? "Master's Student" : "Student";

      btn.disabled = true;
      btn.innerText = 'Creating account...';

      try {
        const res = await apiRequest('/auth/register', 'POST', {
          name, email, password, studentId, degreeLevel, programType, course: programType, department: 'Computer Applications', role
        });

        if (res.success) {
          Auth.setUserSession(res.token, res.data);
          showToast('Account created successfully!', 'success');
          setTimeout(() => {
            window.location.href = '/menu.html';
          }, 500);
        }
      } catch (err) {
        showToast(err.message || 'Registration failed', 'error');
        btn.disabled = false;
        btn.innerText = 'Create Student Account';
      }
    });
  </script>
</body>
</html>
