<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | Smart Campus Canteen</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: var(--bg-main);">
  <div id="navbar-container"></div>

  <div class="container" style="max-width: 680px; margin: 2rem auto;">
    <div class="card" style="padding: 2.25rem; border: 1px solid var(--border-color); box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 1.75rem;">
        <div style="width: 54px; height: 54px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; margin: 0 auto 0.75rem;">📝</div>
        <h2 style="color: var(--primary-dark); font-weight: 800; font-size: 1.6rem; margin-bottom: 0.25rem;">Student Registration</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Create your campus canteen account with academic level & delivery details.</p>
      </div>

      <form id="register-form">
        <h4 style="color: var(--primary); border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; margin-bottom: 1rem; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px;">1. Personal & Account Details</h4>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 1.5rem;">
          <div class="form-group" style="grid-column: span 2;">
            <label class="form-label">Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="Rahul Sharma" required>
          </div>

          <div class="form-group">
            <label class="form-label">College Email</label>
            <input type="email" id="email" class="form-control" placeholder="rahul@canteen.edu" required>
          </div>

          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="9876543210" required>
          </div>

          <div class="form-group">
            <label class="form-label">Student ID Number</label>
            <input type="text" id="studentId" class="form-control" placeholder="STU-2026-88" required>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          </div>
        </div>

        <h4 style="color: var(--primary); border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; margin-bottom: 1rem; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px;">2. Academic Program & Hostel Address</h4>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 1.5rem;">
          <div class="form-group">
            <label class="form-label">Degree Level</label>
            <select id="degreeLevel" class="form-control" required style="font-weight: 600;">
              <option value="Degree">Degree</option>
              <option value="Master's">Master's</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Program / Course</label>
            <select id="course" class="form-control" required>
              <option value="BCA">BCA (Computer Applications)</option>
              <option value="BBA">BBA (Business Admin)</option>
              <option value="BCom">BCom (Commerce)</option>
              <option value="BA">BA (Arts)</option>
              <option value="BSc">BSc (Science)</option>
              <option value="BE/BTech">BE/BTech (Engineering)</option>
              <option value="MCA">MCA (Master Comp Apps)</option>
              <option value="MBA">MBA (Master Bus Admin)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Academic Year</label>
            <select id="year" class="form-control" required>
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year">4th Year</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Semester</label>
            <select id="semester" class="form-control" required>
              <option value="1st Semester">1st Semester</option>
              <option value="2nd Semester">2nd Semester</option>
              <option value="3rd Semester">3rd Semester</option>
              <option value="4th Semester">4th Semester</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Hostel Building</label>
            <select id="hostelBuilding" class="form-control" required>
              <option value="Hostel A">Hostel A Block</option>
              <option value="Hostel B">Hostel B Block</option>
              <option value="Department Block B">Department Block B</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Room Number</label>
            <input type="text" id="roomNumber" class="form-control" placeholder="203" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem; font-weight: 700;">Complete Registration ➔</button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
        Already have an account? <a href="/login.html" style="color: var(--primary); font-weight: 700;">Log In</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        studentId: document.getElementById('studentId').value,
        password: document.getElementById('password').value,
        degreeLevel: document.getElementById('degreeLevel').value,
        course: document.getElementById('course').value,
        year: document.getElementById('year').value,
        semester: document.getElementById('semester').value,
        hostelBuilding: document.getElementById('hostelBuilding').value,
        roomNumber: document.getElementById('roomNumber').value,
        role: document.getElementById('degreeLevel').value === "Master's" ? "Master's Student" : "Student"
      };

      try {
        const res = await apiRequest('/auth/register', 'POST', body);
        Auth.saveSession(res.token, res.user);
        showToast('Account registered successfully!', 'success');
        setTimeout(() => window.location.href = '/index.html', 800);
      } catch (err) {}
    });
  </script>
</body>
</html>
