<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile | Smart Campus Canteen</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: var(--bg-main);">
  <div id="navbar-container"></div>

  <div class="container" style="max-width: 680px; margin: 2rem auto;">
    <div class="card" style="padding: 2.25rem; border: 1px solid var(--border-color); box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 1.75rem;">
        <div style="width: 60px; height: 60px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 0.75rem;">🎓</div>
        <h2 style="color: var(--primary-dark); font-weight: 800; font-size: 1.6rem; margin-bottom: 0.25rem;">Student Profile & Hostel Address</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">View your college identity details and update hostel delivery preferences.</p>
      </div>

      <form id="profile-form">
        <h4 style="color: var(--primary); border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; margin-bottom: 1rem; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px;">Account & Academic Identity</h4>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 1.5rem;">
          <div class="form-group" style="grid-column: span 2;">
            <label class="form-label">Full Name</label>
            <input type="text" id="prof-name" class="form-control" readonly style="background: var(--bg-main); font-weight: 700;">
          </div>

          <div class="form-group">
            <label class="form-label">College Email</label>
            <input type="email" id="prof-email" class="form-control" readonly style="background: var(--bg-main); font-weight: 600;">
          </div>

          <div class="form-group">
            <label class="form-label">Student ID</label>
            <input type="text" id="prof-studentId" class="form-control" readonly style="background: var(--bg-main); font-weight: 700;">
          </div>

          <div class="form-group" style="grid-column: span 2;">
            <label class="form-label">User Role</label>
            <input type="text" id="prof-role" class="form-control" readonly style="background: var(--bg-main); font-weight: 700; color: var(--primary-dark);">
          </div>
        </div>

        <h4 style="color: var(--primary); border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; margin-bottom: 1rem; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px;">Editable Contact & Delivery Details</h4>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 1.5rem;">
          <div class="form-group" style="grid-column: span 2;">
            <label class="form-label">Phone Number</label>
            <input type="tel" id="prof-phone" class="form-control" required style="font-weight: 600;">
          </div>

          <div class="form-group">
            <label class="form-label">Hostel Building</label>
            <input type="text" id="prof-building" class="form-control" required style="font-weight: 600;">
          </div>

          <div class="form-group">
            <label class="form-label">Room Number</label>
            <input type="text" id="prof-room" class="form-control" required style="font-weight: 600;">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem; font-weight: 700;">Save Profile Updates 💾</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Auth.requireAuth();
      try {
        const res = await apiRequest('/auth/me');
        const user = res.user;
        document.getElementById('prof-name').value = user.name;
        document.getElementById('prof-email').value = user.email;
        document.getElementById('prof-studentId').value = user.studentId || 'N/A';
        document.getElementById('prof-role').value = user.role;
        document.getElementById('prof-phone').value = user.phone || '';

        if (user.profile) {
          document.getElementById('prof-building').value = user.profile.hostelBuilding || 'Hostel A';
          document.getElementById('prof-room').value = user.profile.roomNumber || '203';
        }
      } catch (e) {}
    });

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await apiRequest('/users/profile', 'PUT', {
          phone: document.getElementById('prof-phone').value,
          hostelBuilding: document.getElementById('prof-building').value,
          roomNumber: document.getElementById('prof-room').value
        });
        showToast('Profile updated successfully!', 'success');
      } catch (err) {}
    });
  </script>
</body>
</html>
