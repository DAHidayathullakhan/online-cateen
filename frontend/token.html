<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Food Token | Smart Campus Canteen</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: var(--bg-main);">
  <div id="navbar-container"></div>

  <div class="container" style="max-width: 540px; margin: 2rem auto;">
    <div class="card" style="padding: 2.25rem; text-align: center; border: 2px dashed var(--primary); box-shadow: var(--shadow-lg); background: var(--card-bg); position: relative; overflow: hidden;">
      
      <!-- Top Ticket Header -->
      <div style="background: var(--primary-dark); color: white; margin: -2.25rem -2.25rem 1.75rem -2.25rem; padding: 1.25rem; border-bottom: 3px solid var(--accent);">
        <div style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; opacity: 0.85;">Smart Campus Food Token</div>
        <h1 id="token-number" style="font-size: 1.8rem; font-weight: 800; color: white; margin: 0.35rem 0 0.15rem;">CAN-2026-XXXXX</h1>
        <div style="font-size: 0.85rem; opacity: 0.9; margin-top: 0.2rem;" id="order-number-display">Order #ORD-XXXXXX</div>
        <div style="margin-top: 0.5rem;"><span id="token-status" class="status-badge status-READY" style="font-size: 0.8rem; padding: 0.25rem 0.75rem;">Active</span></div>
      </div>

      <!-- Payment Alert / Banner -->
      <div id="payment-notice-banner" style="margin-bottom: 1.25rem; padding: 1rem; border-radius: 10px; font-size: 0.9rem; text-align: left; font-weight: 600;"></div>

      <!-- Live Pickup Countdown -->
      <div id="countdown-timer" style="background: var(--primary-light); color: var(--primary-dark); padding: 0.75rem 1rem; border-radius: 10px; font-weight: 700; font-size: 0.95rem; margin-bottom: 1.5rem; border: 1px solid rgba(37,99,235,0.2);">
        ⏱️ Your pickup window starts in 15 minutes.
      </div>

      <!-- Item Breakdown -->
      <div style="text-align: left; background: var(--bg-main); padding: 1.25rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); font-size: 0.9rem;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
          <span style="color: var(--text-muted);">📍 Canteen Branch:</span>
          <strong id="branch-name" style="color: var(--text-dark);">Main Canteen</strong>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem;">
          <span style="color: var(--text-muted);">⏰ Scheduled Window:</span>
          <strong id="pickup-time" style="color: var(--primary-dark);">12:15 PM - 12:30 PM</strong>
        </div>

        <div style="border-top: 1px dashed var(--border-color); padding-top: 0.75rem;">
          <div style="font-weight: 700; color: var(--text-dark); margin-bottom: 0.5rem;">Ordered Food Items:</div>
          <div id="token-items-list" style="margin-bottom: 0.75rem;"></div>

          <div style="display: flex; justify-content: space-between; margin-top: 0.75rem; padding-top: 0.5rem; border-top: 2px solid var(--border-color); font-weight: 800; font-size: 1.1rem; color: var(--primary-dark);">
            <span>Total Paid Amount:</span>
            <span id="token-total">₹0</span>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
        <button onclick="window.print()" class="btn btn-outline btn-block" style="font-weight: 600;">🖨️ Print Token</button>
        <a href="/orders.html" class="btn btn-primary btn-block" style="font-weight: 700;">View All Orders 📦</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/token.js"></script>
</body>
</html>
