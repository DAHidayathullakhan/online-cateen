<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | Smart Campus Canteen</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: var(--bg-main);">
  <div id="navbar-container"></div>

  <div class="container" style="max-width: 840px; margin: 2rem auto;">
    <div style="margin-bottom: 1.75rem;">
      <span class="role-badge" style="background: var(--primary-light); color: var(--primary); margin-bottom: 0.5rem;">
        📦 Order History & Live Tracker
      </span>
      <h1 style="color: var(--primary-dark); font-weight: 800; font-size: 1.8rem; margin: 0.25rem 0;">My Campus Orders</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Track live kitchen prep progress, view digital QR tokens, rate dishes, or order again with 1-click.</p>
    </div>

    <div id="orders-list"></div>
  </div>

  <!-- Rating & Review Modal -->
  <div id="review-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 9999; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 460px; width: 92%; padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 1.25rem;">
        <div style="font-size: 2.25rem; margin-bottom: 0.25rem;">⭐</div>
        <h3 style="font-weight: 800; color: var(--primary-dark); margin: 0;">Rate Your Food Experience</h3>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem;">Your feedback helps our kitchen staff maintain high quality!</p>
      </div>

      <input type="hidden" id="review-order-id">

      <div class="form-group">
        <label class="form-label">Food Rating</label>
        <select id="food-rating-select" class="form-control" style="font-weight: 700;">
          <option value="5">⭐⭐⭐⭐⭐ 5 Stars (Excellent Taste & Hot)</option>
          <option value="4">⭐⭐⭐⭐ 4 Stars (Very Good)</option>
          <option value="3">⭐⭐⭐ 3 Stars (Average)</option>
          <option value="2">⭐⭐ 2 Stars (Needs Improvement)</option>
          <option value="1">⭐ 1 Star (Poor)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Feedback / Comments (Optional)</label>
        <textarea id="review-comment-input" class="form-control" rows="3" placeholder="Tell us about the taste, portion size, and temperature..."></textarea>
      </div>

      <div style="display: flex; gap: 0.75rem; margin-top: 1.25rem;">
        <button onclick="document.getElementById('review-modal').style.display='none'" class="btn btn-outline btn-block" style="font-weight: 600;">Cancel</button>
        <button onclick="submitReview()" class="btn btn-primary btn-block" style="font-weight: 700;">Submit Review ⭐</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>
