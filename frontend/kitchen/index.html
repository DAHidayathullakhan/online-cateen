<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Kanban Board | Smart Campus Canteen</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: var(--bg-main);">
  <div id="navbar-container"></div>

  <div class="container" style="max-width: 1440px; margin: 2rem auto;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.75rem; flex-wrap: wrap; gap: 1rem;">
      <div>
        <span class="role-badge" style="background: rgba(16,185,129,0.1); color: var(--secondary); margin-bottom: 0.5rem;">
          👨‍🍳 KITCHEN DISPLAY SYSTEM (KDS)
        </span>
        <h1 style="color: var(--primary-dark); font-weight: 800; font-size: 1.8rem; margin: 0.25rem 0;">Kitchen Live Order Board</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Real-time order statuses with 1-click status transitions & prep timers.</p>
      </div>
      <div style="display: flex; gap: 0.75rem;">
        <button onclick="loadKitchenBoard()" class="btn btn-outline" style="font-weight: 700; background: white;">
          🔄 Refresh Kanban Board
        </button>
      </div>
    </div>

    <!-- Kanban Columns -->
    <div class="kanban-board">
      <div class="kanban-col">
        <div class="kanban-header" style="background: #e0f2fe; color: #0369a1; border-bottom: 2px solid #0284c7;">
          <span style="display: flex; align-items: center; gap: 0.5rem;">
            <span>🆕</span> NEW ORDERS
          </span>
          <span style="background: #0284c7; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; font-weight: 700;">•</span>
        </div>
        <div id="col-new"></div>
      </div>

      <div class="kanban-col">
        <div class="kanban-header" style="background: #fef3c7; color: #b45309; border-bottom: 2px solid #d97706;">
          <span style="display: flex; align-items: center; gap: 0.5rem;">
            <span>🔥</span> PREPARING
          </span>
          <span style="background: #d97706; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; font-weight: 700;">•</span>
        </div>
        <div id="col-preparing"></div>
      </div>

      <div class="kanban-col">
        <div class="kanban-header" style="background: #dcfce7; color: #15803d; border-bottom: 2px solid #16a34a;">
          <span style="display: flex; align-items: center; gap: 0.5rem;">
            <span>✅</span> READY FOR PICKUP / DELIVERY
          </span>
          <span style="background: #16a34a; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; font-weight: 700;">•</span>
        </div>
        <div id="col-ready"></div>
      </div>

      <div class="kanban-col">
        <div class="kanban-header" style="background: #f1f5f9; color: #475569; border-bottom: 2px solid #64748b;">
          <span style="display: flex; align-items: center; gap: 0.5rem;">
            <span>🎉</span> COMPLETED
          </span>
          <span style="background: #64748b; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; font-weight: 700;">•</span>
        </div>
        <div id="col-completed"></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/kitchen.js"></script>
</body>
</html>
