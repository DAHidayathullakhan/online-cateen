<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | Smart Campus Canteen</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: var(--bg-main);">
  <div id="navbar-container"></div>

  <div class="container" style="max-width: 820px; margin: 2rem auto;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.5rem;">
      <div>
        <span class="role-badge" style="background: var(--primary-light); color: var(--primary); margin-bottom: 0.5rem;">
          🛒 Order Summary
        </span>
        <h1 style="color: var(--primary-dark); font-weight: 800; font-size: 1.8rem; margin: 0.25rem 0;">Your Campus Food Cart</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Review food items, customize quantities and proceed to pickup slot selection.</p>
      </div>
      <button onclick="Cart.clearCart(); renderCartPage();" class="btn btn-outline" style="color: var(--danger); border-color: var(--danger); font-size: 0.85rem; padding: 0.4rem 0.85rem;">
        🗑️ Clear Cart
      </button>
    </div>

    <div class="card" style="padding: 1.75rem; border: 1px solid var(--border-color); box-shadow: var(--shadow);">
      <div id="cart-container"></div>

      <div id="cart-summary-footer" style="margin-top: 1.75rem; border-top: 2px dashed var(--border-color); padding-top: 1.25rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div>
          <span style="font-size: 0.85rem; color: var(--text-muted); display: block;">Estimated Subtotal</span>
          <span id="cart-subtotal-display" style="font-size: 1.6rem; font-weight: 800; color: var(--primary-dark);">₹0</span>
        </div>
        <a href="/checkout.html" class="btn btn-primary" style="padding: 0.85rem 1.75rem; font-size: 1rem; font-weight: 700; border-radius: 10px;">
          Proceed to Checkout ➔
        </a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', renderCartPage);

    function renderCartPage() {
      const container = document.getElementById('cart-container');
      const footer = document.getElementById('cart-summary-footer');
      const cart = Cart.getCart();

      if (cart.length === 0) {
        if (footer) footer.style.display = 'none';
        container.innerHTML = `
          <div style="text-align: center; padding: 3rem 1rem;">
            <div style="font-size: 3.5rem; margin-bottom: 1rem;">🛒</div>
            <h3 style="color: var(--text-dark); font-weight: 700; margin-bottom: 0.5rem;">Your cart is empty</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Explore our campus food menu and order hot samosas, meals, and beverages.</p>
            <a href="/menu.html" class="btn btn-primary" style="padding: 0.75rem 1.5rem; font-weight: 700;">Explore Menu 🍔</a>
          </div>
        `;
        return;
      }

      if (footer) footer.style.display = 'flex';
      const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      document.getElementById('cart-subtotal-display').textContent = `₹${total}`;

      container.innerHTML = cart.map(item => `
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid var(--border-color); gap: 1rem;">
          <div style="display: flex; align-items: center; gap: 1rem;">
            <img src="${item.image}" alt="${item.name}" onerror="handleImageError(this)" style="width: 65px; height: 65px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
            <div>
              <strong style="font-size: 1.05rem; color: var(--text-dark); font-weight: 700;">${item.name}</strong>
              <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.15rem;">₹${item.price} each</div>
            </div>
          </div>

          <div style="display: flex; align-items: center; gap: 1.25rem;">
            <div style="display: flex; align-items: center; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.2rem;">
              <button onclick="Cart.updateQuantity('${item.menuItemId}', -1); renderCartPage();" class="btn" style="padding: 0.2rem 0.6rem; background: transparent; border: none; font-size: 1.1rem; color: var(--text-dark); cursor: pointer;">-</button>
              <strong style="font-size: 0.95rem; min-width: 24px; text-align: center; color: var(--primary-dark); font-weight: 700;">${item.quantity}</strong>
              <button onclick="Cart.updateQuantity('${item.menuItemId}', 1); renderCartPage();" class="btn" style="padding: 0.2rem 0.6rem; background: transparent; border: none; font-size: 1.1rem; color: var(--text-dark); cursor: pointer;">+</button>
            </div>
            <div style="font-weight: 800; font-size: 1.1rem; width: 70px; text-align: right; color: var(--primary-dark);">₹${item.price * item.quantity}</div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
